server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name SEU-DOMINIO.duckdns.org;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/SEU-DOMINIO.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15552000" always;

    # Área pública temporária de mídia.
    #
    # A Meta Graph API (Instagram/Facebook) não aceita upload direto de vídeo
    # nesse fluxo: ela exige uma URL pública de onde possa BAIXAR o arquivo.
    # O Workflow 03 grava o vídeo aqui com um nome aleatório, publica e apaga
    # logo em seguida — o arquivo fica exposto apenas durante a publicação.
    #
    # autoindex off (padrão) impede listar o diretório, então só quem tem o
    # nome aleatório completo consegue acessar um arquivo.
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    # O Nginx resolve o nome do upstream uma única vez, na inicialização, e
    # guarda o IP. Como o container do n8n muda de IP a cada recriação, isso
    # fazia o proxy responder 502 até um reload manual.
    #
    # Apontar para o resolver interno do Docker (127.0.0.11) e usar uma
    # variável no proxy_pass força o Nginx a re-resolver o nome a cada
    # 10 segundos, eliminando a necessidade de reload após reiniciar o n8n.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_n8n http://n8n:5678;
        proxy_pass $upstream_n8n;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # n8n pode ter execuções longas disparadas via webhook; evita
        # que o Nginx corte a conexão no timeout padrão de 60s.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_cache_bypass $http_upgrade;
    }
}