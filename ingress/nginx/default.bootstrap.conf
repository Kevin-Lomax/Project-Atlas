# Configuração de BOOTSTRAP — usada apenas na primeira instalação.
#
# Por que ela existe:
#
# A configuração de produção (default.conf) declara um bloco `listen 443 ssl`
# apontando para o certificado do Let's Encrypt. Se esse certificado ainda não
# existe, o Nginx **não inicia** — ele falha com "cannot load certificate".
#
# Mas o certificado só pode ser emitido se o Nginx já estiver respondendo na
# porta 80, para servir o desafio ACME. Ou seja: sem esta configuração, a
# primeira instalação trava num impasse circular.
#
# Esta configuração serve HTTP puro: responde ao desafio do Certbot e já
# encaminha para o n8n, permitindo criar a conta e configurar credenciais
# antes mesmo do HTTPS existir.
#
# Como usar: ver a seção "Instalação" do README.
# Depois de emitir o certificado, troque NGINX_CONF de volta para
# default.conf no .env — a partir daí o acesso é todo por HTTPS.

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Necessário para o Certbot validar o domínio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mesmo resolver dinâmico da configuração de produção: sem ele o Nginx
    # guarda o IP do container do n8n e passa a responder 502 depois de
    # qualquer recriação.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_n8n http://n8n:5678;
        proxy_pass $upstream_n8n;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_cache_bypass $http_upgrade;
    }
}
