# Antes de executar:
# 1. Crie um arquivo .env copiando o .env.example
# 2. Edite o arquivo .env com suas credenciais

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    # Imagem oficial + ffmpeg (ver docker/n8n/Dockerfile).
    build:
      context: ./docker/n8n
      args:
        N8N_VERSION: 2.32.1
    image: project-atlas/n8n:2.32.1-ffmpeg
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      # Área pública temporária: a Meta Graph API exige uma URL publicamente
      # acessível para buscar o vídeo. O Workflow 03 grava o arquivo aqui,
      # publica e apaga em seguida. Ver ingress/nginx/default.conf.
      - media_data:/media
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ingress/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ingress/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - media_data:/var/www/media:ro
    networks:
      - app-network
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://127.0.0.1:443/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  media_data: